[build]
  publish = "dist"
  command = "npm run check"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["private/pdfs/**"]

[build.environment]
  NODE_VERSION = "22"
  # The reserved admin email is an identifier documented in the setup files.
  # Keep secret scanning enabled for database credentials and password hashes.
  SECRETS_SCAN_OMIT_KEYS = "PREPATOZ_ADMIN_EMAIL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
